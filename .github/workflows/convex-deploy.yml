name: Deploy Convex

# בכל push ל-main, וגם ידנית מלשונית Actions עם "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: convex-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Missing CONVEX_DEPLOY_KEY secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - run: npm ci

      # מעלה את התיקייה convex/ לשרת scintillating-coyote-982 (הפרודקשן).
      - name: Deploy Convex backend
        run: |
          set -o pipefail
          npx convex deploy -y 2>&1 | tee deploy.log

      # בודק שהשרת שעודכן הוא השרת שהאתר פונה אליו (js/convex-config.js), ומציג את יעד הפריסה בסיכום הריצה.
      - name: Verify the deployment is the one the site uses
        if: always()
        run: |
          want=$(grep -o 'https://[a-z0-9-]*' js/convex-config.js | head -1 | sed 's#https://##')
          got=$(grep -o 'https://[a-z0-9-]*[a-z0-9.-]*\.convex\.cloud' deploy.log | tail -1 | sed 's#https://##; s#\..*##')
          tail_log=$(tail -n 6 deploy.log | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr '\n' '|' | cut -c1-600)
          echo "::notice title=Convex deploy::site=$want deployed=${got:-unknown} log=$tail_log"
          if [ -n "$got" ] && [ "$got" != "$want" ]; then
            echo "::error::Convex deployed to $got, but the site uses $want (js/convex-config.js). Check the CONVEX_DEPLOY_KEY secret."
            exit 1
          fi
