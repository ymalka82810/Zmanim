<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2c4a7c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קטלוג בית הכנסת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kiddush/css/styles.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column}
.item.sold{opacity:.65}
.item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--wine-soft)}
.item .noimg{aspect-ratio:4/3;display:grid;place-items:center;background:var(--wine-soft);color:var(--muted);font-size:2.2rem}
.item .body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .t{font-weight:700;font-size:1.05rem}
.item .price{font-family:var(--serif);font-weight:900;font-size:1.3rem;color:var(--wine)}
.item .desc{white-space:pre-wrap;font-size:.92rem}
.item .row{margin-top:auto;padding-top:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.prev{display:block;max-width:100%;max-height:180px;border-radius:10px;margin-top:6px}
</style>
<script src="../js/theme.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="empty">טוען…</div></div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="../js/menu.js"></script>
<script src="../js/dialog.js"></script>
<script src="../js/convex-config.js"></script>
<script src="../vendor/convex/convex-browser-1.46.0.js"></script>
<script src="../js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
