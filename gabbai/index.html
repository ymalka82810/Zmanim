<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2c4a7c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קופת בית הכנסת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../vendor/hebcal/hebcal-core-6.9.3.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="day">
  <div class="in">
    <div>
      <a class="home-link" href="../">→ לוח הזמנים</a>
      <div class="syn" id="synName">קופת בית הכנסת</div>
      <div class="parsha" id="todayParsha">…</div>
      <div class="dates" id="todayDates"></div>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="הגדרות">⚙ הגדרות</button>
  </div>
</header>
<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true">סקירה</button>
  <button role="tab" data-tab="ledger" aria-selected="false">דף חשבון ודוחות</button>
  <button role="tab" data-tab="donations" aria-selected="false">תרומות ומצוות</button>
  <button role="tab" data-tab="petty" aria-selected="false">קופה קטנה</button>
  <button role="tab" data-tab="salary" aria-selected="false">משכורת</button>
</div></nav>
<main class="wrap" id="view"></main>
<button class="fab" id="addBtn">+ רישום חדש</button>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <form method="dialog" id="txForm">
    <div class="dlg-h"><h3 id="dlgTitle">רישום חדש</h3><button type="button" class="lnk" data-close>סגור</button></div>
    <div class="dlg-b">
      <div class="types" id="typePick">
        <button type="button" data-t="donation">תרומה</button>
        <button type="button" data-t="mitzvah">מכירת מצווה</button>
        <button type="button" data-t="salary">משכורת</button>
        <button type="button" data-t="expense">הוצאה</button>
        <button type="button" data-t="petty">קנייה מקופה קטנה</button>
        <button type="button" data-t="pettyIn">מילוי קופה קטנה</button>
      </div>
      <div class="f" data-for="mitzvah"><span>המצווה</span>
        <select name="mitzvah">
          <option>עלייה לתורה</option><option>שלישי</option><option>שישי</option><option>מפטיר</option>
          <option>פתיחת הארון</option><option>הגבהה</option><option>גלילה</option><option>הוצאה והכנסה</option>
          <option>חתן תורה</option><option>חתן בראשית</option><option>אתה הראית</option><option>אחר</option>
        </select></div>
      <div class="f" data-for="donation mitzvah"><span id="nameLbl">שם התורם</span><input name="name" list="donorList" autocomplete="off"><datalist id="donorList"></datalist></div>
      <div class="f" data-for="salary"><span>משכורת עבור חודש</span><input name="month" placeholder="לדוגמה: תשרי תשפ״ז"></div>
      <div class="two">
        <div class="f"><span>סכום (₪)</span><input name="amount" type="number" inputmode="decimal" min="0" step="0.01" required></div>
        <div class="f"><span id="dateLbl">תאריך</span><input name="date" type="date" lang="he" required><div class="hint" id="dateHint"></div></div>
      </div>
      <div class="f" data-for="expense petty"><span>קטגוריה</span>
        <select name="category"><option>כיבוד וקידוש</option><option>ניקיון</option><option>חשמל ומים</option><option>תחזוקה ותיקונים</option><option>ספרים ותשמישי קדושה</option><option>משרד</option><option>אחר</option></select></div>
      <div class="f" data-for="expense petty"><span>ספק / מקום הקנייה</span><input name="vendor"></div>
      <div class="f"><span id="descLbl">תיאור</span><textarea name="desc" rows="2"></textarea></div>
      <div class="f" data-for="donation mitzvah"><span>אמצעי תשלום</span>
        <select name="method"><option>מזומן</option><option>העברה בנקאית</option><option>צ׳ק</option><option>אשראי</option><option>הוראת קבע</option></select></div>
      <div data-for="donation mitzvah salary" class="f">
        <label class="check"><input type="checkbox" name="paid"> <span id="paidLbl">שולם</span></label>
      </div>
      <div class="f" data-for="donation mitzvah salary" id="paidDateWrap"><span>תאריך תשלום</span><input name="paidDate" type="date" lang="he"><div class="hint" id="paidHint"></div></div>
    </div>
    <div class="dlg-f"><button class="btn" type="submit" id="saveBtn">שמור</button><button class="btn ghost" type="button" data-close>ביטול</button></div>
  </form>
</dialog>

<dialog id="setDlg">
  <form method="dialog" id="setForm">
    <div class="dlg-h"><h3>הגדרות</h3><button type="button" class="lnk" data-close>סגור</button></div>
    <div class="dlg-b">
      <div class="f"><span>שם בית הכנסת</span><input name="synName"></div>
      <div class="two">
        <div class="f"><span>יתרת פתיחה – עו״ש (₪)</span><input name="openMain" type="number" step="0.01"></div>
        <div class="f"><span>יתרת פתיחה – קופה קטנה (₪)</span><input name="openPetty" type="number" step="0.01"></div>
      </div>
      <div class="f"><span>לוח פרשיות</span><select name="israel"><option value="1">ארץ ישראל</option><option value="0">חוץ לארץ</option></select></div>
    </div>
    <div class="dlg-f"><button class="btn" type="submit">שמור הגדרות</button></div>
  </form>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
